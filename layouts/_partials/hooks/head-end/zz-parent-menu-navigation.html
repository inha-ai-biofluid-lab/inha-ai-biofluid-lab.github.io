<script>
(function () {
  function setupParentMenuNavigation() {
    const destinations = {
      INTRODUCTION: '/introduction/#about',
      MEMBERS: '/members/#professor'
      BOARD: '/board/'
    };

    document
      .querySelectorAll('nav span[role="button"]')
      .forEach(function (button) {
        const label = button.textContent
          .replace(/\s+/g, ' ')
          .trim()
          .toUpperCase();

        const destination = destinations[label];

        if (!destination) return;
        if (button.dataset.parentNavigationReady === 'true') return;

        button.dataset.parentNavigationReady = 'true';

        button.addEventListener(
          'click',
          function (event) {
            /*
             * 메뉴 글자를 누르면 해당 페이지로 이동합니다.
             * 화살표를 직접 누르면 기존 하위 메뉴가 열립니다.
             */
            if (event.target.closest('svg')) return;

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            window.location.href = destination;
          },
          true
        );

        button.addEventListener(
          'keydown',
          function (event) {
            if (event.key !== 'Enter') return;

            event.preventDefault();
            event.stopPropagation();
            window.location.href = destination;
          },
          true
        );
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupParentMenuNavigation);
  } else {
    setupParentMenuNavigation();
  }
})();
</script>
