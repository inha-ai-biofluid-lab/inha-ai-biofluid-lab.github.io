<script>
(function () {
  function setupParentMenuNavigation() {
    const destinations = {
      INTRODUCTION: '/introduction/#about',
      MEMBERS: '/members/#professor'
    };

    const menuLinks = document.querySelectorAll(
      'nav a, .navbar a, [role="navigation"] a'
    );

    menuLinks.forEach(function (link) {
      const label = link.textContent
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();

      Object.entries(destinations).forEach(function ([menuName, destination]) {
        if (!label.startsWith(menuName)) return;
        if (link.dataset.parentNavigationReady === 'true') return;

        link.dataset.parentNavigationReady = 'true';
        link.setAttribute('href', destination);

        link.addEventListener(
          'click',
          function (event) {
            /* 데스크톱에서는 드롭다운을 고정하지 않고 바로 이동 */
            if (window.matchMedia('(min-width: 992px)').matches) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              window.location.assign(destination);
            }
          },
          true
        );
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupParentMenuNavigation);
  } else {
    setupParentMenuNavigation();
  }
})();
</script>
