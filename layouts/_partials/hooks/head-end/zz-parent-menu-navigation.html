<script>
document.addEventListener('DOMContentLoaded', function () {
  const parentMenuRoutes = {
    'INTRODUCTION': '/introduction/#about',
    'MEMBERS': '/members/#professor'
  };

  document.querySelectorAll('header a').forEach(function (link) {
    const menuName = link.textContent
      .replace(/\s+/g, ' ')
      .trim()
      .toUpperCase();

    Object.entries(parentMenuRoutes).forEach(function ([name, destination]) {
      if (!menuName.startsWith(name)) return;

      link.addEventListener(
        'click',
        function (event) {
          /* 모바일에서는 기존 드롭다운 동작 유지 */
          if (window.innerWidth < 992) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          window.location.href = destination;
        },
        true
      );
    });
  });
});
</script>
