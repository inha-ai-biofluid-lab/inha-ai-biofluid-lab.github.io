<style>
  .abfe-research-page {
    --research-navy: #0b2c4d;
    --research-navy-dark: #061b30;
    --research-blue: #176b87;
    --research-cyan: #29b8c7;
    --research-light: #eef5f7;
    --research-line: #d8e3e8;
    --research-text: #10263b;
    --research-muted: #687985;

    width: min(1180px, calc(100vw - 3rem));
    margin-left: 50%;
    padding: clamp(4rem, 7vw, 7rem) 0;
    color: var(--research-text);
    transform: translateX(-50%);
  }

  .abfe-research-page,
  .abfe-research-page * {
    box-sizing: border-box;
  }

  .abfe-research-page a {
    text-decoration: none;
  }

  .abfe-research-page section[id],
  .abfe-research-page article[id] {
    scroll-margin-top: 100px;
  }

  /* Page heading */

  .abfe-research-heading {
    position: relative;
    margin-bottom: clamp(4rem, 8vw, 7rem);
    padding-bottom: 3rem;
    border-bottom: 1px solid var(--research-line);
  }

  .abfe-research-heading::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100px;
    height: 3px;
    background: var(--research-cyan);
  }

  .abfe-research-heading > p,
  .abfe-research-section-heading > p,
  .abfe-research-vision > div:first-child > p,
  .abfe-research-footer > div > p {
    margin: 0 0 1rem;
    color: var(--research-cyan);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .abfe-research-heading h1 {
    max-width: 880px;
    margin: 0;
    color: var(--research-text);
    font-family: var(--hb-font-heading);
    font-size: clamp(2.7rem, 5.5vw, 5rem);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.055em;
    word-break: keep-all;
  }

  .abfe-research-heading > span {
    display: block;
    max-width: 720px;
    margin-top: 1.6rem;
    color: var(--research-muted);
    font-size: 1rem;
    line-height: 1.8;
  }

  /* Research vision */

  .abfe-research-vision {
    display: grid;
    grid-template-columns: 0.85fr 1.15fr;
    gap: clamp(2.5rem, 7vw, 6rem);
    margin-bottom: clamp(5rem, 10vw, 9rem);
    padding: clamp(2.5rem, 5vw, 4.5rem);
    color: #ffffff;
    background:
      radial-gradient(circle at 90% 20%, rgba(41, 184, 199, 0.2), transparent 30%),
      linear-gradient(135deg, var(--research-navy-dark), var(--research-navy));
  }

  .abfe-research-vision h2 {
    margin: 0;
    color: #ffffff;
    font-family: var(--hb-font-heading);
    font-size: clamp(2rem, 3.5vw, 3.3rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.04em;
  }

  .abfe-research-vision > div:last-child p {
    margin: 0 0 1.3rem;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.9;
    word-break: keep-all;
  }

  .abfe-research-vision > div:last-child p:last-child {
    margin-bottom: 0;
  }

  /* Shared sections */

  .abfe-research-section {
    margin-bottom: clamp(5rem, 10vw, 9rem);
  }

  .abfe-research-section-heading {
    margin-bottom: clamp(2rem, 4vw, 3.5rem);
  }

  .abfe-research-section-heading h2 {
    margin: 0;
    color: var(--research-text);
    font-family: var(--hb-font-heading);
    font-size: clamp(2rem, 3.8vw, 3.5rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.045em;
  }

  /* Core research cards */

  .abfe-core-research-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
  }

  .abfe-core-research-grid article {
    min-height: 490px;
    padding: clamp(1.6rem, 3vw, 2.4rem);
    border: 1px solid var(--research-line);
    background: #ffffff;
    transition:
      transform 200ms ease,
      border-color 200ms ease,
      box-shadow 200ms ease;
  }

  .abfe-core-research-grid article:hover {
    transform: translateY(-6px);
    border-color: var(--research-cyan);
    box-shadow: 0 20px 45px rgba(11, 44, 77, 0.1);
  }

  .abfe-core-research-grid article > span {
    color: var(--research-cyan);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  .abfe-core-research-grid h3 {
    margin: 3rem 0 0.4rem;
    color: var(--research-text);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .abfe-core-research-grid article > strong {
    display: block;
    margin-bottom: 1.6rem;
    color: var(--research-blue);
    font-size: 0.86rem;
  }

  .abfe-core-research-grid article > p {
    margin: 0 0 1.5rem;
    color: var(--research-muted);
    line-height: 1.8;
    word-break: keep-all;
  }

  .abfe-core-research-grid ul {
    margin: 0;
    padding: 1.3rem 0 0;
    border-top: 1px solid var(--research-line);
    list-style: none;
  }

  .abfe-core-research-grid li {
    position: relative;
    margin: 0.65rem 0;
    padding-left: 1rem;
    color: var(--research-muted);
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .abfe-core-research-grid li::before {
    content: "";
    position: absolute;
    top: 0.62em;
    left: 0;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--research-cyan);
  }

  /* Project list */

  .abfe-project-detail-section {
    padding-top: clamp(4rem, 7vw, 6rem);
    border-top: 1px solid var(--research-line);
  }

  .abfe-project-detail-list {
    border-top: 1px solid var(--research-line);
  }

  .abfe-project-detail-list article {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr);
    gap: clamp(1.5rem, 5vw, 5rem);
    padding: clamp(2rem, 4vw, 3.5rem) 0;
    border-bottom: 1px solid var(--research-line);
  }

  .abfe-project-number {
    color: var(--research-cyan);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  .abfe-project-description > p {
    margin: 0 0 0.7rem;
    color: var(--research-blue);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .abfe-project-description h3 {
    max-width: 780px;
    margin: 0;
    color: var(--research-text);
    font-size: clamp(1.3rem, 2.3vw, 2rem);
    font-weight: 700;
    line-height: 1.35;
  }

  .abfe-project-description > span {
    display: block;
    max-width: 720px;
    margin-top: 1rem;
    color: var(--research-muted);
    line-height: 1.8;
    word-break: keep-all;
  }

  /* Research process */

  .abfe-research-process {
    padding: clamp(3rem, 6vw, 5rem);
    background: var(--research-light);
  }

  .abfe-process-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid #bed0d7;
    border-bottom: 1px solid #bed0d7;
  }

  .abfe-process-grid > div {
    min-height: 210px;
    padding: 1.6rem;
    border-right: 1px solid #bed0d7;
  }

  .abfe-process-grid > div:last-child {
    border-right: 0;
  }

  .abfe-process-grid span {
    color: var(--research-cyan);
    font-size: 0.78rem;
    font-weight: 700;
  }

  .abfe-process-grid strong {
    display: block;
    margin-top: 3rem;
    color: var(--research-text);
    font-size: 1.5rem;
    line-height: 1.4;
  }

  .abfe-process-grid p {
    margin: 0.7rem 0 0;
    color: var(--research-muted);
    font-size: 0.92rem;
    line-height: 1.65;
    word-break: keep-all;
  }

  /* Footer CTA */

  .abfe-research-footer {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .abfe-research-footer > div {
    min-height: 320px;
    padding: clamp(2rem, 5vw, 4rem);
    color: #ffffff;
    background: var(--research-navy);
  }

  .abfe-research-footer > div:last-child {
    background: var(--research-blue);
  }

  .abfe-research-footer h2 {
    max-width: 420px;
    margin: 0 0 3rem;
    color: #ffffff;
    font-size: clamp(1.7rem, 3vw, 2.7rem);
    line-height: 1.25;
    letter-spacing: -0.035em;
  }

  .abfe-research-footer a {
    color: #ffffff;
    font-size: 0.88rem;
    font-weight: 700;
  }

  .abfe-research-footer a:hover {
    color: var(--research-cyan);
  }

  /* Tablet */

  @media (max-width: 900px) {
    .abfe-research-vision {
      grid-template-columns: 1fr;
    }

    .abfe-core-research-grid {
      grid-template-columns: 1fr;
    }

    .abfe-core-research-grid article {
      min-height: auto;
    }

    .abfe-process-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .abfe-process-grid > div:nth-child(2) {
      border-right: 0;
    }

    .abfe-process-grid > div:nth-child(-n + 2) {
      border-bottom: 1px solid #bed0d7;
    }
  }

  /* Mobile */

  @media (max-width: 640px) {
    .abfe-research-page {
      width: calc(100vw - 2.5rem);
      padding-top: 3.5rem;
      padding-bottom: 5rem;
    }

    .abfe-research-heading h1 {
      font-size: clamp(2.3rem, 11vw, 3.3rem);
    }

    .abfe-research-vision,
    .abfe-research-process {
      padding: 2rem 1.3rem;
    }

    .abfe-project-detail-list article {
      grid-template-columns: 1fr;
      gap: 0.8rem;
    }

    .abfe-process-grid {
      grid-template-columns: 1fr;
    }

    .abfe-process-grid > div {
      min-height: 160px;
      border-right: 0;
      border-bottom: 1px solid #bed0d7;
    }

    .abfe-process-grid > div:last-child {
      border-bottom: 0;
    }

    .abfe-process-grid strong {
      margin-top: 2rem;
    }

    .abfe-research-footer {
      grid-template-columns: 1fr;
    }
  }
</style>
