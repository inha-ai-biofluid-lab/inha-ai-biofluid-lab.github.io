<style>
  .abfe-home-research,
  .abfe-home-research * {
    box-sizing: border-box;
  }

  .abfe-home-research {
    width: 100vw;
    max-width: 100vw;
    margin-left: calc(50% - 50vw);
    border-top: 1px solid #d8e2e9;
    background: #f5f8fa;
    color: #10243b;
  }

  .abfe-home-research__inner {
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
    padding: 75px 0 85px;
  }

  /* 상단 제목 */
  .abfe-home-research__header {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.1fr);
    align-items: end;
    gap: clamp(40px, 8vw, 110px);
    margin-bottom: 47px;
  }

  .abfe-home-research__header > div > p {
    margin: 0 0 14px;
    color: #0b8f96;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.15em;
  }

  .abfe-home-research__header h2 {
    margin: 0;
    color: #10243b;
    font-size: clamp(2rem, 3.5vw, 3.25rem);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.045em;
    word-break: keep-all;
  }

  .abfe-home-research__intro {
    max-width: 590px;
    margin: 0;
    color: #637589;
    font-size: 0.94rem;
    line-height: 1.85;
    word-break: keep-all;
  }

  /* 연구 분야 목록 */
  .abfe-home-research__list {
    border-top: 2px solid #0b2c4d;
  }

  .abfe-home-research__item {
    position: relative;
    display: grid;
    grid-template-columns:
      52px
      minmax(290px, 0.95fr)
      minmax(280px, 1.05fr)
      30px;
    align-items: center;
    gap: 24px;
    min-height: 118px;
    padding: 25px 22px 25px 10px;
    overflow: hidden;
    border-bottom: 1px solid #d6e0e7;
    color: #10243b;
    text-decoration: none;
    isolation: isolate;
    transition: color 0.3s ease;
  }

  .abfe-home-research__item::before {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: #0b2c4d;
    content: "";
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .abfe-home-research__item:hover::before {
    transform: scaleX(1);
    transform-origin: left center;
  }

  .abfe-home-research__number {
    color: #0b8f96;
    font-size: 0.68rem;
    font-weight: 850;
    letter-spacing: 0.1em;
    transition: color 0.3s ease;
  }

  .abfe-home-research__title {
    min-width: 0;
  }

  .abfe-home-research__title strong {
    display: block;
    color: inherit;
    font-size: clamp(1rem, 1.4vw, 1.22rem);
    font-weight: 780;
    line-height: 1.4;
  }

  .abfe-home-research__title span {
    display: block;
    margin-top: 8px;
    color: #708194;
    font-size: 0.78rem;
    line-height: 1.5;
    transition: color 0.3s ease;
  }

  .abfe-home-research__item > p {
    margin: 0;
    color: #68798b;
    font-size: 0.85rem;
    line-height: 1.75;
    word-break: keep-all;
    transition: color 0.3s ease;
  }

  .abfe-home-research__arrow {
    color: #0b8f96;
    font-size: 1.15rem;
    text-align: right;
    transition:
      color 0.3s ease,
      transform 0.3s ease;
  }

  .abfe-home-research__item:hover {
    color: #ffffff;
  }

  .abfe-home-research__item:hover .abfe-home-research__number,
  .abfe-home-research__item:hover .abfe-home-research__arrow {
    color: #61f0e5;
  }

  .abfe-home-research__item:hover .abfe-home-research__title span,
  .abfe-home-research__item:hover > p {
    color: rgba(255, 255, 255, 0.68);
  }

  .abfe-home-research__item:hover .abfe-home-research__arrow {
    transform: translateX(5px);
  }

  /* 하단 링크 */
  .abfe-home-research__footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 28px;
  }

  .abfe-home-research__footer a {
    display: inline-flex;
    align-items: center;
    gap: 24px;
    color: #0b2c4d;
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-decoration: none;
  }

  .abfe-home-research__footer a span {
    color: #0b8f96;
    font-size: 1rem;
    transition: transform 0.2s ease;
  }

  .abfe-home-research__footer a:hover {
    color: #0b8f96;
  }

  .abfe-home-research__footer a:hover span {
    transform: translateX(5px);
  }

  /* 태블릿 */
  @media (max-width: 900px) {
    .abfe-home-research__header {
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .abfe-home-research__item {
      grid-template-columns: 44px minmax(0, 1fr) 28px;
    }

    .abfe-home-research__item > p {
      grid-column: 2 / 3;
      margin-top: -10px;
    }

    .abfe-home-research__arrow {
      grid-column: 3;
      grid-row: 1 / 3;
    }
  }

  /* 모바일 */
  @media (max-width: 600px) {
    .abfe-home-research__inner {
      width: calc(100% - 36px);
      padding: 58px 0 68px;
    }

    .abfe-home-research__header {
      margin-bottom: 35px;
    }

    .abfe-home-research__header h2 {
      font-size: 2.1rem;
    }

    .abfe-home-research__item {
      grid-template-columns: 34px minmax(0, 1fr) 22px;
      gap: 12px;
      min-height: 0;
      padding: 24px 5px;
    }

    .abfe-home-research__title strong {
      font-size: 0.98rem;
    }

    .abfe-home-research__item > p {
      font-size: 0.8rem;
    }

    .abfe-home-research__item::before {
      display: none;
    }

    .abfe-home-research__item:hover {
      color: #10243b;
    }

    .abfe-home-research__item:hover .abfe-home-research__title span,
    .abfe-home-research__item:hover > p {
      color: #68798b;
    }

    .abfe-home-research__footer {
      justify-content: flex-start;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .abfe-home-research__item::before,
    .abfe-home-research__arrow,
    .abfe-home-research__footer a span {
      transition: none;
    }
  }
</style>
