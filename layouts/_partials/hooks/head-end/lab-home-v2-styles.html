<style>
  .abfe-home-v2 {
    position: relative;
    width: 100vw;
    max-width: 100vw;
    height: calc(100svh - 72px);
    min-height: 650px;
    max-height: 900px;
    margin-left: calc(50% - 50vw);

    background: #061525;
    color: #ffffff;

  }

  /* 배경 효과 */
  .abfe-home-v2__background {
    position: absolute;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }

  .abfe-home-v2__background::before {
    position: absolute;
    inset: 0;
    background:

        rgba(6, 21, 37, 0.98) 0%,
        rgba(6, 21, 37, 0.93) 46%,
        rgba(6, 21, 37, 0.72) 100%
      );
    content: "";
  }

  .abfe-home-v2__background::after {
    position: absolute;
    inset: 0;
    opacity: 0.2;
    background-image:
      linear-gradient(rgba(97, 240, 229, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(97, 240, 229, 0.06) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: linear-gradient(to right, transparent 12%, black 100%);
    content: "";
  }

  .abfe-home-v2__glow {
    position: absolute;
    display: block;
    border-radius: 50%;
    filter: blur(10px);
  }

  .abfe-home-v2__glow--one {
    top: -22%;
    right: -8%;
    width: 700px;
    height: 700px;
    background: radial-gradient(
      circle,
      rgba(39, 193, 189, 0.2) 0%,
      rgba(39, 193, 189, 0.04) 45%,
      transparent 72%
    );
  }

  .abfe-home-v2__glow--two {
    bottom: -48%;
    left: 15%;
    width: 650px;
    height: 650px;
    background: radial-gradient(
      circle,
      rgba(26, 102, 165, 0.18) 0%,
      transparent 70%
    );
  }

  .abfe-home-v2__flow {
    position: absolute;
    right: -14%;
    display: block;
    width: 68%;
    height: 44%;
    border: 1px solid rgba(97, 240, 229, 0.14);
    border-radius: 50%;
    transform: rotate(-18deg);
  }

  .abfe-home-v2__flow--one {
    top: 4%;
  }

  .abfe-home-v2__flow--two {
    top: 21%;

  .abfe-home-v2__button--secondary:hover {
    border-color: #61f0e5;
    color: #61f0e5;
    transform: translateY(-2px);
  }

  .abfe-home-v2__pi {

    font-weight: 750;

    font-weight: 650;

    justify-content: center;

    width: min(500px, 42vw);

    border: 1px solid rgba(97, 240, 229, 0.28);

    transform: rotate(-31deg) scaleY(0.7);

  .abfe-home-v2__orbit--three {

    border-color: rgba(255, 255, 255, 0.14);
    transform: rotate(70deg) scaleY(0.63);
  }

    left: 50%;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    height: 185px;

      inset 0 0 35px rgba(39, 193, 189, 0.08);
    backdrop-filter: blur(8px);
    transform: translate(-50%, -50%);
  }

  .abfe-home-v2__visual-core span {
    color: #ffffff;
    font-size: 3.15rem;
    font-weight: 850;
    line-height: 1;
    letter-spacing: -0.08em;
  }

  .abfe-home-v2__visual-core strong {
    margin-top: 10px;
    color: #61f0e5;
    font-size: 0.7rem;
    font-weight: 750;
    letter-spacing: 0.2em;
  }

  .abfe-home-v2__keyword {
    position: absolute;
    padding: 7px 10px;
    border: 1px solid rgba(97, 240, 229, 0.23);
    border-radius: 3px;
    background: rgba(6, 21, 37, 0.78);

    font-size: 0.57rem;
    font-weight: 700;

    align-items: center;

    letter-spacing: 0.045em;

      height: auto;
      padding: 70px 0 120px;

    .abfe-home-v2__visual-core {

      height: 150px;
    }

    .abfe-home-v2__visual-core span {

    .abfe-home-v2__inner {

    .abfe-home-v2__description {
      font-size: 0.9rem;
    }

    .abfe-home-v2__pi {
      align-items: flex-start;
      flex-direction: column;
      gap: 7px;
      margin-top: 32px;
    }

    .abfe-home-v2__visual {
      width: 100%;
      height: 390px;
      margin-top: 10px;
    }

    .abfe-home-v2__visual-fallback {
      width: min(390px, 94vw);
    }

    .abfe-home-v2__topics {
      position: static;
      grid-template-columns: repeat(2, 1fr);
    }

    .abfe-home-v2__topics span:nth-child(2) {
      border-right: 0;
    }

    .abfe-home-v2__topics span:nth-child(-n + 2) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
  }

  @media (max-width: 430px) {
    .abfe-home-v2__actions {
      flex-direction: column;
    }

    .abfe-home-v2__button {
      width: 100%;
    }

    .abfe-home-v2__visual {
      height: 330px;
    }

    .abfe-home-v2__keyword--cfd {
      left: 3%;
    }

    .abfe-home-v2__keyword--twin {
      right: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .abfe-home-v2__button {
      transition: none;
    }
  }

.abfe-home-v2__copy h1 .abfe-home-v2__title-en {

  letter-spacing: -0.025em;
  white-space: nowrap;
}

.abfe-home-v2__copy h1 .abfe-home-v2__title-ko {
  margin-top: 0.22em;

  .abfe-home-v2__description {

  }

  .abfe-home-v2__button {
    min-height: 52px;
    padding-right: 25px;
    padding-left: 25px;
    font-size: 0.84rem;
  }

  .abfe-home-v2__visual {

  .abfe-home-v2__image {

  }

  .abfe-home-v2__visual-fallback {

}
