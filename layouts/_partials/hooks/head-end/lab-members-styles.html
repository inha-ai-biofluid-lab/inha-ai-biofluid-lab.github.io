<style>
  .abfe-members-page {
    --members-navy: #0b2c4d;
    --members-blue: #176b87;
    --members-cyan: #29b8c7;
    --members-light: #eef5f7;
    --members-line: #d9e2e7;
    --members-text: #10263b;
    --members-muted: #687985;

    width: min(1180px, calc(100vw - 3rem));
    margin-left: 50%;
    padding: clamp(4rem, 7vw, 7rem) 0;
    color: var(--members-text);
    transform: translateX(-50%);
  }

  .abfe-members-page,
  .abfe-members-page * {
    box-sizing: border-box;
  }

  .abfe-members-page a {
    text-decoration: none;
  }

  .abfe-members-page section[id] {
    scroll-margin-top: 100px;
  }

  /* Page heading */

  .abfe-members-heading {
    position: relative;
    margin-bottom: clamp(4rem, 7vw, 6.5rem);
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--members-line);
  }

  .abfe-members-heading::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 90px;
    height: 3px;
    background: var(--members-cyan);
  }

  .abfe-members-heading > p,
  .abfe-members-section-title > p,
  .member-group-title > div > p {
    margin: 0 0 1rem;
    color: var(--members-cyan);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .abfe-members-heading h1 {
    margin: 0;
    color: var(--members-text);
    font-family: var(--hb-font-heading);
    font-size: clamp(2.6rem, 5vw, 4.6rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.05em;
  }

  .abfe-members-heading > span {
    display: block;
    margin-top: 1.2rem;
    color: var(--members-muted);
    font-size: 0.95rem;
  }

  /* Shared section */

  .abfe-members-section {
    margin-bottom: clamp(5rem, 9vw, 8rem);
  }

  .abfe-members-section:last-child {
    margin-bottom: 0;
  }

  .abfe-members-section-title {
    margin-bottom: 2rem;
  }

  .abfe-members-section-title h2 {
    margin: 0;
    color: var(--members-text);
    font-family: var(--hb-font-heading);
    font-size: clamp(1.8rem, 3vw, 2.7rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.035em;
  }

  .member-group-title {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 1.4rem;
    border-bottom: 1px solid var(--members-line);
  }

  .member-group-title > div > p {
    margin-bottom: 0.65rem;
  }

  .member-group-title > span {
    color: var(--members-muted);
    font-size: 0.78rem;
    font-weight: 600;
  }

  /* Professor */

  .abfe-professor-profile {
    display: grid;
    grid-template-columns: minmax(280px, 370px) minmax(0, 1fr);
    gap: clamp(2.5rem, 7vw, 6rem);
    align-items: stretch;
    min-height: 470px;
    padding: clamp(1.5rem, 3vw, 2.5rem);
    border: 1px solid var(--members-line);
    background: #ffffff;
  }

  .abfe-professor-photo {
    position: relative;
    min-height: 420px;
    overflow: hidden;
    background:
      linear-gradient(145deg, #e8f1f4, #d6e5e9);
  }

  .abfe-professor-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .abfe-professor-information {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 1rem 0;
  }

  .abfe-professor-label {
    margin: 0 0 0.8rem;
    color: var(--members-blue);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .abfe-professor-information h3 {
    margin: 0;
    color: var(--members-text);
    font-size: clamp(2rem, 3.3vw, 3.1rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.04em;
  }

  .abfe-professor-information h3 span {
    display: block;
    margin-top: 0.45rem;
    color: var(--members-muted);
    font-size: 0.48em;
    font-weight: 500;
    letter-spacing: 0;
  }

  .abfe-professor-affiliation {
    margin: 1.6rem 0 2rem;
    color: var(--members-muted);
    line-height: 1.8;
  }

  .abfe-professor-details {
    border-top: 1px solid var(--members-line);
  }

  .abfe-professor-details div {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr);
    gap: 1rem;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--members-line);
  }

  .abfe-professor-details span {
    color: var(--members-blue);
    font-size: 0.67rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .abfe-professor-details strong,
  .abfe-professor-details a {
    color: var(--members-text);
    font-size: 0.86rem;
    font-weight: 600;
    line-height: 1.6;
  }

  .abfe-professor-details a:hover {
    color: var(--members-blue);
  }

  .abfe-member-profile-link {
    align-self: flex-start;
    margin-top: 1.8rem;
    color: var(--members-blue);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .abfe-member-profile-link:hover {
    color: var(--members-cyan);
  }

  /* Member cards */

  .abfe-member-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
  }

  .abfe-member-card {
    overflow: hidden;
    border: 1px solid var(--members-line);
    border-radius: 4px;
    background: #ffffff;
    transition:
      transform 200ms ease,
      border-color 200ms ease,
      box-shadow 200ms ease;
  }

  .abfe-member-card:hover {
    transform: translateY(-6px);
    border-color: var(--members-cyan);
    box-shadow: 0 18px 38px rgba(11, 44, 77, 0.11);
  }

  .abfe-member-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 4.6;
    overflow: hidden;
    background: var(--members-light);
  }

  .abfe-member-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    transition: transform 300ms ease;
  }

  .abfe-member-card:hover .abfe-member-photo img {
    transform: scale(1.025);
  }

  /* Placeholder shown until a member photo is uploaded */

  .abfe-member-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 70% 25%, rgba(41, 184, 199, 0.2), transparent 30%),
      linear-gradient(145deg, #eef5f7, #dce9ed);
  }

  .abfe-member-placeholder::before,
  .abfe-member-placeholder::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(23, 107, 135, 0.18);
    border-radius: 50%;
  }

  .abfe-member-placeholder::before {
    width: 170px;
    height: 170px;
  }

  .abfe-member-placeholder::after {
    width: 110px;
    height: 110px;
  }

  .abfe-member-placeholder span {
    position: relative;
    z-index: 1;
    color: var(--members-navy);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.18em;
  }

  .professor-placeholder {
    position: relative;
    height: 100%;
  }

  .abfe-member-card-copy {
    min-height: 155px;
    padding: 1.25rem;
  }

  .abfe-member-card-copy > p {
    margin: 0 0 0.55rem;
    color: var(--members-blue);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .abfe-member-card-copy h3 {
    margin: 0;
    color: var(--members-text);
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
  }

  .abfe-member-card-copy h3 span {
    display: block;
    margin-top: 0.2rem;
    color: var(--members-muted);
    font-size: 0.76rem;
    font-weight: 500;
  }

  .abfe-member-card-copy a {
    display: inline-block;
    max-width: 100%;
    margin-top: 1rem;
    overflow-wrap: anywhere;
    color: var(--members-muted);
    font-size: 0.76rem;
  }

  .abfe-member-card-copy a:hover {
    color: var(--members-blue);
  }

  /* Alumni */

  .abfe-alumni-section {
    padding-top: 4rem;
    border-top: 1px solid var(--members-line);
  }

  .abfe-alumni-empty {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    min-height: 100px;
    padding: 1.5rem 0;
    border-top: 1px solid var(--members-line);
    border-bottom: 1px solid var(--members-line);
  }

  .abfe-alumni-empty span {
    color: var(--members-text);
    font-weight: 700;
  }

  .abfe-alumni-empty p {
    margin: 0;
    color: var(--members-muted);
    font-size: 0.88rem;
  }

  /* Tablet */

  @media (max-width: 900px) {
    .abfe-professor-profile {
      grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
      gap: 2rem;
    }

    .abfe-professor-photo {
      min-height: 390px;
    }

    .abfe-member-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  /* Mobile */

  @media (max-width: 680px) {
    .abfe-members-page {
      width: calc(100vw - 2.5rem);
      padding-top: 3.5rem;
      padding-bottom: 5rem;
    }

    .abfe-professor-profile {
      grid-template-columns: 1fr;
      padding: 1rem;
    }

    .abfe-professor-photo {
      min-height: auto;
      aspect-ratio: 4 / 4.5;
    }

    .abfe-professor-information {
      padding: 1rem 0.4rem 0.6rem;
    }

    .abfe-professor-details div {
      grid-template-columns: 1fr;
      gap: 0.3rem;
    }

    .abfe-member-grid {
      grid-template-columns: 1fr;
    }

    .member-group-title {
      align-items: flex-start;
      flex-direction: column;
      gap: 0.8rem;
    }

    .abfe-alumni-empty {
      align-items: flex-start;
      flex-direction: column;
      gap: 0.5rem;
    }
  }
/* Professor detailed history */
.abfe-professor-history {
  width: 100%;
  margin-top: 30px;
  border-top: 1px solid #d6e1e8;
}

.abfe-professor-history__toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0;
  color: #08a9b8;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  list-style: none;
}

.abfe-professor-history__toggle::-webkit-details-marker {
  display: none;
}

.abfe-professor-history__toggle strong {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  color: #08a9b8;
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.abfe-professor-history[open]
.abfe-professor-history__toggle strong {
  transform: rotate(45deg);
}

.abfe-professor-history__content {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  padding: 5px 0 30px;
}

.abfe-professor-history__section {
  padding: 28px;
  background: #f4f8fa;
}

.abfe-professor-history__section:nth-child(3),
.abfe-professor-history__section:nth-child(4) {
  grid-column: 1 / -1;
}

.abfe-professor-history__section h3 {
  margin: 0 0 22px;
  color: #08768e;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.abfe-professor-history__section h4 {
  margin: 24px 0 12px;
  color: #11283d;
  font-size: 15px;
  font-weight: 800;
}

.abfe-professor-history__entry {
  display: block;
  margin-bottom: 28px;
}

.abfe-professor-history__entry time {
  display: block;
  margin-bottom: 10px;
}

.abfe-professor-history__entry p {
  word-break: keep-all;
}

.abfe-professor-history__entry:last-child {
  margin-bottom: 0;
}

.abfe-professor-history__entry time,
.abfe-professor-history__awards time {
  color: #08a9b8;
  font-size: 13px;
  font-weight: 800;
}

.abfe-professor-history__entry strong {
  color: #11283d;
  font-size: 15px;
}

.abfe-professor-history__entry p {
  margin: 8px 0 0;
  color: #687b8c;
  font-size: 14px;
  line-height: 1.75;
}

.abfe-professor-history__list,
.abfe-professor-history__courses,
.abfe-professor-history__awards {
  margin: 0;
  padding: 0;
  list-style: none;
}

.abfe-professor-history__list li,
.abfe-professor-history__courses li {
  padding: 10px 0;
  color: #11283d;
  font-size: 14px;
  line-height: 1.6;
  border-bottom: 1px solid #d6e1e8;
}

.abfe-professor-history__list li:last-child,
.abfe-professor-history__courses li:last-child {
  border-bottom: none;
}

.abfe-professor-history__list span {
  display: block;
  margin-top: 3px;
  color: #738697;
}

.abfe-professor-history__courses strong {
  display: inline-block;
  min-width: 82px;
  color: #08768e;
}

.abfe-professor-history__awards li {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr);
  gap: 14px;
  padding: 11px 0;
  color: #11283d;
  font-size: 14px;
  line-height: 1.55;
  border-bottom: 1px solid #d6e1e8;
}

.abfe-professor-history__awards li:last-child {
  border-bottom: none;
}

@media (max-width: 800px) {
  .abfe-professor-history__content {
    grid-template-columns: 1fr;
  }

  .abfe-professor-history__section:nth-child(3),
  .abfe-professor-history__section:nth-child(4) {
    grid-column: auto;
  }

  .abfe-professor-history__section {
    padding: 22px 18px;
  }

  .abfe-professor-history__entry {
    grid-template-columns: 1fr;
    gap: 6px;
  }
}
  
</style>
